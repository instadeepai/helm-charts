name: InstaDeep mlflow chart

# InstaDeep only. Tests charts/mlflow on pull requests to instadeep-main, and publishes it to
# ghcr.io/instadeepai/helm-charts when run by hand with "publish". The file and its commit are separate
# from the chart changes, so upstream syncs never conflict with it and commits sent upstream never
# carry it. The repository guard stops it in any other repository.

on:
  pull_request:
    branches: [instadeep-main]
    paths:
      - "charts/mlflow/**"
      - ".github/workflows/instadeep-mlflow-chart.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the version in charts/mlflow/Chart.yaml to ghcr.io (it must not exist yet)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CHART_DIR: charts/mlflow
  OCI_REPOSITORY: oci://ghcr.io/instadeepai/helm-charts
  HELM_VERSION: v3.22.0
  HELM_UNITTEST_VERSION: v1.1.2

jobs:
  test:
    name: Lint, test and package
    if: github.repository == 'instadeepai/helm-charts'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build the chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add minio https://charts.min.io/
          helm dependency build "$CHART_DIR"

      - name: Lint
        run: helm lint "$CHART_DIR"

      - name: Unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION"
          helm unittest --strict --file 'unittests/**/*.yaml' "$CHART_DIR"

      - name: Package
        id: package
        run: |
          helm package "$CHART_DIR" --destination dist
          echo "version=$(helm show chart dist/*.tgz | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: mlflow-chart
          path: dist/*.tgz
          retention-days: 7

  publish:
    name: Publish to ghcr.io
    needs: test
    # Only merged code: a run from any other branch stops here.
    if: >-
      github.repository == 'instadeepai/helm-charts' && github.event_name == 'workflow_dispatch' &&
      inputs.publish && github.ref == 'refs/heads/instadeep-main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mlflow-chart
          path: dist

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to ghcr.io
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin

      # Environments pin chart versions, so a published version must never change.
      - name: Refuse to overwrite a published version
        run: |
          if out=$(helm show chart "$OCI_REPOSITORY/mlflow" --version "$VERSION" 2>&1); then
            echo "::error::mlflow $VERSION is already on ghcr.io. Bump the version in $CHART_DIR/Chart.yaml."
            exit 1
          fi
          if ! echo "$out" | grep -qiE "not found|manifest unknown"; then
            echo "::error::Cannot tell whether mlflow $VERSION exists: $out"
            exit 1
          fi

      - name: Push
        run: helm push "dist/mlflow-$VERSION.tgz" "$OCI_REPOSITORY"
