suite: test flask server secret key

templates:
  - configmap.yaml
  - flask_secret.yaml
  - deployment.yaml

tests:
  - it: should create the secret by default
    templates:
      - flask_secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mlflow-flask-server-secret-key

  - it: should use the given key when flaskServerSecretKey is set
    set:
      flaskServerSecretKey: s3cr3t
    templates:
      - flask_secret.yaml
    asserts:
      - equal:
          path: data.MLFLOW_FLASK_SERVER_SECRET_KEY
          value: s3cr3t
          decodeBase64: true

  - it: should not create the secret when an existing one is referenced
    set:
      flaskServerSecretKeyExistingSecret.name: my-flask-secret
    templates:
      - flask_secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should reference the existing secret from the deployment
    set:
      flaskServerSecretKeyExistingSecret.name: my-flask-secret
    templates:
      - deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-flask-secret

  - it: should reference the chart-managed secret from the deployment by default
    templates:
      - deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-mlflow-flask-server-secret-key
