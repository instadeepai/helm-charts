{{- if and .Values.tracker.enabled .Values.tracker.ingress.enabled }}
{{- $fullName := include "mlflow.fullname" . -}}
{{- $svcPort := .Values.tracker.service.port | default 80 -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-tracker
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracker
  {{- with .Values.tracker.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.tracker.ingress.className }}
  ingressClassName: {{ .Values.tracker.ingress.className }}
  {{- end }}
  {{- if .Values.tracker.ingress.tls }}
  tls:
    {{- range .Values.tracker.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.tracker.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            backend:
              service:
                name: {{ $fullName }}-tracker
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
