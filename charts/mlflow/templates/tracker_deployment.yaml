{{- if .Values.tracker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlflow.fullname" . }}-tracker
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracker
spec:
  replicas: {{ .Values.tracker.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "mlflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tracker
  template:
    metadata:
      annotations:
        checksum/tracker-config: {{ include (print $.Template.BasePath "/tracker_configmap.yaml") . | sha256sum }}
      labels:
        {{- include "mlflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tracker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tracker
          image: "{{ .Values.tracker.image.repository }}:{{ .Values.tracker.image.tag }}"
          imagePullPolicy: {{ .Values.tracker.image.pullPolicy | default "IfNotPresent" }}
          command: ["python"]
          args:
            - "/app/dashboard_server.py"
            - "--mlflow-url"
            - "http://{{ include "mlflow.fullname" . }}:{{ .Values.service.port }}"
            - "--port"
            - "{{ .Values.tracker.service.containerPort | default 8501 }}"
          ports:
            - name: tracker
              containerPort: {{ .Values.tracker.service.containerPort | default 8501 }}
              protocol: TCP
          env:
          {{- if or .Values.auth.enabled .Values.ldapAuth.enabled }}
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth-admin-secret" (include "mlflow.fullname" .)) .Values.auth.existingAdminSecret.name }}
                  key: {{ ternary "username" .Values.auth.existingAdminSecret.usernameKey (eq .Values.auth.existingAdminSecret.name "") }}
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-auth-admin-secret" (include "mlflow.fullname" .)) .Values.auth.existingAdminSecret.name }}
                  key: {{ ternary "password" .Values.auth.existingAdminSecret.passwordKey (eq .Values.auth.existingAdminSecret.name "") }}
          {{- end }}
          {{- range $key, $value := .Values.tracker.extraEnvVars }}
            - name: {{ upper $key }}
              value: {{ $value | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: tracker
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: tracker
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml (.Values.tracker.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: tracker-files
              mountPath: /app
              readOnly: true
      volumes:
        - name: tracker-files
          configMap:
            name: {{ include "mlflow.fullname" . }}-tracker
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
